services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Netresearch\NrPasskeysBe\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      # Widget classes reference typo3/cms-dashboard interfaces (a suggest,
      # not a requirement) and are registered explicitly in the guarded
      # Services.Dashboard.php instead.
      - '../Classes/Widgets/*'

  # Event listener tags for TYPO3 v12 (does not support #[AsEventListener] attribute).
  # v13+ ignores these tags when the attribute is present.
  Netresearch\NrPasskeysBe\EventListener\InjectPasskeyLoginFields:
    tags:
      - name: event.listener
        identifier: 'nr-passkeys-be/inject-passkey-login-fields'
        event: TYPO3\CMS\Backend\LoginProvider\Event\ModifyPageLayoutOnLoginProviderSelectionEvent

  Netresearch\NrPasskeysBe\EventListener\InjectPasskeyBanner:
    tags:
      - name: event.listener
        identifier: 'nr-passkeys-be/inject-passkey-banner'
        event: TYPO3\CMS\Backend\Controller\Event\AfterBackendPageRenderEvent

  cache.nr_passkeys_be_nonce:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['nr_passkeys_be_nonce']

  cache.nr_passkeys_be_ratelimit:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['nr_passkeys_be_ratelimit']

  Netresearch\NrPasskeysBe\Service\ChallengeService:
    public: true
    arguments:
      $nonceCache: '@cache.nr_passkeys_be_nonce'

  Netresearch\NrPasskeysBe\Service\RateLimiterService:
    public: true
    arguments:
      $rateLimitCache: '@cache.nr_passkeys_be_ratelimit'

  Netresearch\NrPasskeysBe\Service\WebAuthnService:
    public: true

  Netresearch\NrPasskeysBe\Service\CredentialRepository:
    public: true

  Netresearch\NrPasskeysBe\Service\EnforcementService:
    public: true

  Netresearch\NrPasskeysBe\Service\AdoptionStatsService:
    public: true

  # Backend segment provider for the unified passkey-adoption dashboard
  # widgets. Tagged explicitly here rather than relying solely on the
  # registerForAutoconfiguration() rule in Services.php. autoconfigure is
  # disabled for this one service so the interface autoconfiguration does
  # NOT also apply its tag — that would list the provider twice in the
  # tagged_iterator and double-count the credentials total. public so the
  # DI smoke test can resolve it.
  Netresearch\NrPasskeysBe\Service\BackendPasskeyAdoptionStatsProvider:
    public: true
    autoconfigure: false
    tags:
      - name: nr_passkeys_be.adoption_stats_provider

  Netresearch\NrPasskeysBe\Service\ExtensionConfigurationService:
    public: true

  Netresearch\NrPasskeysBe\Controller\LoginController:
    public: true

  Netresearch\NrPasskeysBe\Controller\ManagementController:
    public: true

  Netresearch\NrPasskeysBe\Controller\AdminController:
    public: true

  Netresearch\NrPasskeysBe\Controller\AdminModuleController:
    public: true

  # FormEngine elements must be public for GeneralUtility::makeInstance() DI resolution.
  # Required by NodeFactory on TYPO3 v12 (setData path) and v13+ alike.
  Netresearch\NrPasskeysBe\Form\Element\PasskeyInfoElement:
    public: true

  Netresearch\NrPasskeysBe\UserSettings\PasskeySettingsPanelElement:
    public: true

