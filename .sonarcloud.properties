# SonarQube Cloud — Automatic Analysis configuration.
#
# This file, NOT sonar-project.properties, is what Automatic Analysis reads.
# Only a subset of sonar.* properties is honoured from it; sonar.exclusions and
# sonar.cpd.exclusions are, sonar.issue.ignore.multicriteria is not — those
# belong in the project settings under Administration › General Settings ›
# Analysis Scope › Issues.

# Exclude test code from copy-paste (duplication) detection.
#
# The quality gate on `main` fails on `new_duplicated_lines_density` (4.99%,
# required ≤ 3%), and every duplicated line of new code is in test code.
# Measured against the branch on 2026-09-18 via the measures API:
#
#   Tests/      726 duplicated of 8140 new lines
#   Classes/      0 duplicated of 3512 new lines
#   Resources/    0 duplicated of  981 new lines
#
# The largest contributors are Tests/Unit/Middleware/PasskeySetupInterstitialTest
# (321 lines), Tests/Unit/Service/WebAuthnServiceTest (276) and
# Tests/Unit/Form/Element/PasskeyInfoElementTest (147) — per-scenario arrange
# blocks, which are idiomatic in tests: collapsing them into shared helpers to
# satisfy a duplication metric makes a failing test harder to read, which is the
# opposite of what the metric exists for.
#
# Not excluded: Resources/Public/JavaScript/PasskeyDashboard.js carries 75
# duplicated lines in the project total. It is production code, it is outside
# the new-code period, and it is a real finding — left visible on purpose.
sonar.cpd.exclusions=Tests/**
