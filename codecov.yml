codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: auto

flags:
  unit:
    paths:
      - Classes/
    carryforward: true
  functional:
    paths:
      - Classes/
    carryforward: true
  fuzz:
    paths:
      - Classes/
    carryforward: true

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
  individual_components:
    - component_id: service
      name: Service Layer
      paths:
        - Classes/Service/
    - component_id: middleware
      name: Middleware
      paths:
        - Classes/Middleware/
    - component_id: domain
      name: Domain
      paths:
        - Classes/Domain/
    - component_id: controller
      name: Controllers
      paths:
        - Classes/Controller/
    - component_id: auth
      name: Authentication
      paths:
        - Classes/Authentication/

ignore:
  - .Build/
  - Tests/
  - Configuration/
  - ext_emconf.php
  - ext_localconf.php
  - ext_tables.sql
