<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Module" />
<f:section name="Content">
    <h1><f:translate key="dashboard.title" extensionName="NrPasskeysBe" /></h1>

    <div class="dashboard-stats" id="passkey-dashboard">
        <!-- Adoption Progress -->
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title"><f:translate key="dashboard.adoption.title" extensionName="NrPasskeysBe" /></h3>
            </div>
            <div class="panel-body">
                <div class="row">
                    <div class="col-sm-4">
                        <dl>
                            <dt><f:translate key="dashboard.totalUsers" extensionName="NrPasskeysBe" /></dt>
                            <dd>{totalUsers}</dd>
                        </dl>
                    </div>
                    <div class="col-sm-4">
                        <dl>
                            <dt><f:translate key="dashboard.usersWithPasskeys" extensionName="NrPasskeysBe" /></dt>
                            <dd>{usersWithPasskeys}</dd>
                        </dl>
                    </div>
                    <div class="col-sm-4">
                        <dl>
                            <dt><f:translate key="dashboard.adoptionRate" extensionName="NrPasskeysBe" /></dt>
                            <dd><f:format.number decimals="1">{adoptionPercentage}</f:format.number>%</dd>
                        </dl>
                    </div>
                </div>
                <div class="progress" style="margin-top: 10px;">
                    <div class="progress-bar progress-bar-success"
                         role="progressbar"
                         aria-valuenow="{adoptionPercentage}"
                         aria-valuemin="0"
                         aria-valuemax="100"
                         style="width: {adoptionPercentage}%;">
                        <f:format.number decimals="1">{adoptionPercentage}</f:format.number>%
                    </div>
                </div>
            </div>
        </div>

        <!-- Group Enforcement Table -->
        <f:if condition="{groups}">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <h3 class="panel-title"><f:translate key="dashboard.groups.title" extensionName="NrPasskeysBe" /></h3>
                </div>
                <div class="table-fit">
                    <table class="table table-striped table-hover" id="passkey-groups-table">
                        <thead>
                            <tr>
                                <th><f:translate key="dashboard.groups.group" extensionName="NrPasskeysBe" /></th>
                                <th><f:translate key="dashboard.groups.enforcement" extensionName="NrPasskeysBe" /></th>
                                <th><f:translate key="dashboard.groups.gracePeriod" extensionName="NrPasskeysBe" /></th>
                                <th><f:translate key="dashboard.groups.users" extensionName="NrPasskeysBe" /></th>
                                <th><f:translate key="dashboard.groups.withPasskeys" extensionName="NrPasskeysBe" /></th>
                                <th><f:translate key="dashboard.groups.adoption" extensionName="NrPasskeysBe" /></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{groups}" as="group">
                                <tr>
                                    <td>{group.title}</td>
                                    <td>
                                        <select class="form-select form-select-sm passkey-enforcement-select"
                                                data-group-uid="{group.uid}"
                                                data-original-value="{group.enforcement}">
                                            <f:for each="{enforcementLevels}" as="label" key="value">
                                                <f:if condition="{value} == {group.enforcement}">
                                                    <f:then><option value="{value}" selected="selected">{label}</option></f:then>
                                                    <f:else><option value="{value}">{label}</option></f:else>
                                                </f:if>
                                            </f:for>
                                        </select>
                                    </td>
                                    <td>{group.gracePeriodDays}</td>
                                    <td>{group.totalUsers}</td>
                                    <td>{group.usersWithPasskeys}</td>
                                    <td>
                                        <div class="progress" style="margin: 0; min-width: 60px;">
                                            <div class="progress-bar progress-bar-info"
                                                 role="progressbar"
                                                 style="width: {group.adoptionPercentage}%;">
                                                <f:format.number decimals="1">{group.adoptionPercentage}</f:format.number>%
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </div>
        </f:if>

        <!-- Users Without Passkeys -->
        <f:if condition="{usersWithoutPasskeys}">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <h3 class="panel-title"><f:translate key="dashboard.usersWithout.title" extensionName="NrPasskeysBe" /></h3>
                </div>
                <div class="table-fit">
                    <table class="table table-striped table-hover" id="passkey-users-table">
                        <thead>
                            <tr>
                                <th><f:translate key="dashboard.usersWithout.username" extensionName="NrPasskeysBe" /></th>
                                <th><f:translate key="dashboard.usersWithout.name" extensionName="NrPasskeysBe" /></th>
                                <th><f:translate key="dashboard.usersWithout.groups" extensionName="NrPasskeysBe" /></th>
                                <th><f:translate key="dashboard.usersWithout.gracePeriodRemaining" extensionName="NrPasskeysBe" /></th>
                                <th><f:translate key="dashboard.usersWithout.actions" extensionName="NrPasskeysBe" /></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{usersWithoutPasskeys}" as="user">
                                <tr>
                                    <td>
                                        <a href="{user.editUrl}" title="{f:translate(key: 'dashboard.usersWithout.editUser', extensionName: 'NrPasskeysBe')}">
                                            {user.username}
                                        </a>
                                    </td>
                                    <td>{user.realName}</td>
                                    <td>{user.groups}</td>
                                    <td>
                                        <f:if condition="{user.gracePeriodRemainingDays} > 0">
                                            <f:then>
                                                <span class="label label-warning">{user.gracePeriodRemainingDays} days</span>
                                            </f:then>
                                            <f:else>
                                                <f:if condition="{user.gracePeriodStart} > 0">
                                                    <f:then>
                                                        <span class="label label-danger"><f:translate key="dashboard.usersWithout.expired" extensionName="NrPasskeysBe" /></span>
                                                    </f:then>
                                                    <f:else>
                                                        <span class="label label-default"><f:translate key="dashboard.usersWithout.notStarted" extensionName="NrPasskeysBe" /></span>
                                                    </f:else>
                                                </f:if>
                                            </f:else>
                                        </f:if>
                                    </td>
                                    <td>
                                        <button type="button"
                                                class="btn btn-sm btn-default passkey-send-reminder"
                                                data-user-uid="{user.uid}"
                                                data-username="{user.username}">
                                            <f:translate key="dashboard.usersWithout.sendReminder" extensionName="NrPasskeysBe" />
                                        </button>
                                        <button type="button"
                                                class="btn btn-sm btn-warning passkey-unlock-user"
                                                data-user-uid="{user.uid}"
                                                data-username="{user.username}">
                                            <f:translate key="dashboard.usersWithout.unlock" extensionName="NrPasskeysBe" />
                                        </button>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </div>
        </f:if>

        <f:if condition="!{groups} && !{usersWithoutPasskeys}">
            <div class="callout callout-success">
                <div class="callout-body">
                    <f:translate key="dashboard.allAdopted" extensionName="NrPasskeysBe" />
                </div>
            </div>
        </f:if>
    </div>
</f:section>
</html>
