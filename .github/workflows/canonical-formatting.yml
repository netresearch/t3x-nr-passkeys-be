name: Canonical formatting

# The formatter alone cannot hold this. It accepts both the collapsed and the
# expanded shape of the same code, so a hand edit that writes one of them is
# never reported — and the next AST edit reflows the file, putting somebody
# else's formatting into that change's diff. The printer and the formatter
# together have exactly one fixed point; this job asserts the tree is on it.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

jobs:
  canonical:
    name: Canonical formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The printer is not a Composer dependency of this extension: it is an
      # agent skill, pinned by commit because a tag can be force-updated and
      # this one decides what "canonical" means for every file in the tree.
      # Not hypothetical: `format` no longer exists on the skill's main branch,
      # so a moved v0.3.0 would not drift the output, it would end the job.
      - name: Check out the printer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: netresearch/php-ast-edit-skill
          ref: da9dc69d68e6692cd7f40e0707027581edfe59e2 # v0.3.0
          path: .printer
          persist-credentials: false

      # The extension's floor, and the version its own Code Style job uses:
      # typo3-ci-workflows resolves cgl-php-version to the first entry of
      # php-versions, which is 8.2 here. There is no composer.lock, so the
      # formatter's version is whatever composer resolves for the running PHP —
      # setting up a different one would let this job and `ci / Code Style`
      # disagree about the fixed point they both assert. It also matches the
      # --php-version the printer is given below.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install the printer's dependencies
        working-directory: .printer
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install this extension's dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Exactly the three trees Build/.php-cs-fixer.php's Finder visits. The
      # two halves only have a fixed point where BOTH of them run: over `.` the
      # printer also reaches Build/*.php and the root ext_*.php, which the
      # formatter never sees, so its raw output stands there -- measured on this
      # branch as `declare (strict_types=1);`, `die()` collapsed to `die`, and
      # multi-line arrays folded onto one line. None of that is PER-CS, and
      # nothing downstream would repair it.
      - name: Print canonically
        run: |
          for dir in Classes Tests Configuration; do
            php .printer/bin/php-ast-edit format --path "$dir" --php-version 8.2
          done

      - name: Apply the project's formatting rules
        run: .Build/bin/php-cs-fixer fix --config Build/.php-cs-fixer.php

      # Neither half is a check on its own: the printer undoes what the
      # formatter did last, and the formatter accepts shapes the printer would
      # not produce. The clean tree is the assertion.
      - name: The tree must be unchanged
        run: git diff --exit-code
