name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 6 * * 1'

# A new push to a pull request cancels the run for the push before it, so
# superseded test matrices stop taking runners. Every other run (main, merge
# queue, schedule) gets a group of its own through github.run_id: GitHub keeps
# one pending run per group and cancels the older pending run even when
# cancel-in-progress is off, so a group shared by main pushes and the schedule
# would drop runs. The group sits here in the caller, not in the reusable
# workflow: a caller that invokes ci.yml twice would otherwise put both calls
# in one group and cancel one with the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Per-extension test matrix (intentional-drift). Security/quality jobs are in checks.yml.
jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2", "8.3", "8.4", "8.5"]'
      typo3-versions: '["^12.4", "^13.4", "^14.3"]'
      typo3-packages: '["typo3/cms-core", "typo3/cms-backend", "typo3/cms-setup"]'
      php-extensions: 'intl, mbstring, xml, openssl, pdo_mysql'
      run-rector: true
      run-functional-tests: true
      functional-test-db: 'mysql'
      upload-coverage: true
      remove-dev-deps: '[{"dep":"netresearch/typo3-ci-workflows","only-for":"^13.4|^14.3"}]'
      # The shared PHPStan job installs phpunit/phpunit:<13 as a migration
      # window for the with*()-without-expects() deprecation. The advisory
      # PHPStan (unpinned PHPUnit) job analyses one cell without that cap, and
      # on this repository it is clean: PHPStan never sees the deprecation
      # because these tests use createMock(), whose method() still returns an
      # InvocationMocker carrying with*(). Blocking keeps it that way instead
      # of letting the first createStub() rewrite reintroduce it unnoticed.
      phpstan-unpinned-blocking: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
