name: CI
on:
  push:
  pull_request:
permissions: {}
jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2", "8.3", "8.4", "8.5"]'
      typo3-versions: '["^12.4", "^13.4", "^14.1"]'
      typo3-packages: '["typo3/cms-core", "typo3/cms-backend", "typo3/cms-setup"]'
      matrix-exclude: '[{"php": "8.5", "typo3": "^12.4"}, {"php": "8.5", "typo3": "^13.4"}]'
      run-rector: false
      run-functional-tests: true
      functional-test-db: mysql
      db-image: 'mysql:8.0'
      remove-dev-deps: '[{"dep": "saschaegerer/phpstan-typo3", "only-for": "^13"}]'
