name: JavaScript Tests

# Runs the Vitest suite in Tests/JavaScript (`npm run test:js`). The ES
# modules in Resources/Public/JavaScript have unit tests, but no workflow ran
# them: the shared typo3-ci-workflows ci.yml has no JavaScript job.
#
# Thin caller of the shared node-test reusable, so the action pins and
# harden-runner stay maintained centrally. Coverage (vitest.config.mjs
# already counts every module in Resources/Public/JavaScript/) goes to
# Codecov under the `js` flag that codecov.yml declares for that directory;
# its project status is informational, and the default project status
# covers the PHP flags only.
# (js-tests.yml is not part of the typo3-extension template, so
# check-template-drift.yml does not byte-compare it.)

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vitest:
    uses: netresearch/.github/.github/workflows/node-test.yml@main
    permissions:
      contents: read
    with:
      package-manager: npm
      node-version: '24'
      install-cmd: npm ci --no-audit --no-fund
      # vitest.config.mjs already writes text, json, html and lcov; these flags
      # replace that list with the two CI uses: lcov for Codecov, text for the
      # job log.
      test-cmd: npm run test:js:coverage -- --coverage.reporter=lcov --coverage.reporter=text
      coverage-upload: true
      coverage-file: ./coverage/lcov.info
      coverage-flags: js
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
