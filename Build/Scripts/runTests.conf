# Per-extension settings for the shared test runner. See runTests.conf.dist in
# netresearch/typo3-ci-workflows for everything that can go here.

# The functional config lives at Build/phpunit.functional.xml, which detection
# does not look for; without this pin it falls back to Build/phpunit.xml, and
# that file carries only the unit and fuzz suites — a functional run would ask
# for a testsuite that is not in the file it was handed. The two configs also
# bootstrap differently: Tests/bootstrap.php here, the testing framework there.
PHPUNIT_FUNCTIONAL_CONFIG="Build/phpunit.functional.xml"

# `-s e2e` builds its own TYPO3: MariaDB, a composer-installed instance with
# this extension from a path repository, PHP-FPM and Apache. Without this the
# runner only asks for the address of an instance that already runs — and the
# code that used to start one (PHP built-in server on 8080, MySQL on 3307) was
# part of the forked runner this repository dropped.
#
# The suite drives the backend only — every spec starts at /typo3/login — so
# there are no extra packages, no demo content and no site dependencies to
# provide. This flag is what opts such a suite in without those hooks.
#
# The instance is TYPO3 13 unless E2E_TYPO3_VERSION=14 says otherwise. Prefer
# that variable over `-t 14`: `-t` is not suite-gated, so it rewrites this
# extension's composer.json and runs a `composer require` before provisioning
# even starts.
E2E_PROVISION=1

# The one thing a backend-only suite still has to provide. Provisioning ends
# with a hard check that the FRONTEND answers 200, and a root page whose
# template defines no page object does not: TYPO3 13 answers 500 there, the
# check refuses to hand over an instance in that state, and the run stops
# before Playwright starts. No test opens this page — it exists so the health
# check has something to see.
e2e_provision_typoscript() {
    cat > "${E2E_SCRIPTS}/ts-setup.typoscript" << 'TYPOSCRIPT'
page = PAGE
page.10 = TEXT
page.10.value = nr_passkeys_be e2e
TYPOSCRIPT
}

# Pin rpId and origin to the address the browser will use. The extension
# refuses to derive them from the Host header while trustedHostsPattern is '.*'
# (ExtensionConfigurationService, exception 1700000060) — that is a real guard
# against Host-header spoofing, and '.*' is exactly what provisioning writes,
# so every backend request ends in a 500 and every spec that logs in skips with
# "Login failed".
#
# This replaces the additional.php that provisioning writes, and loses nothing
# by it: TYPO3 `require`s that file for its side effects and discards what it
# returns (ConfigurationManager::exportConfiguration()), while provisioning's
# version only returns an array. The proof is in the failure this fixes — it
# was logged by the ProductionExceptionHandler, which is precisely the handler
# that file's ignored return value would have replaced.
#
# The host is typo3.localhost rather than the Apache container's name: WebAuthn
# needs a secure context, and Chromium grants that to .localhost but not to a
# container name over plain http. playwright.config.ts points the browser at
# that name and resolves it to the container; both files have to agree on it.
e2e_provision_seed() {
    local host="typo3.localhost"

    cat > "${E2E_ROOT}/config/system/additional.php" << PHP
<?php

declare(strict_types=1);

\$GLOBALS['TYPO3_CONF_VARS']['EXTENSIONS']['nr_passkeys_be']['rpId'] = '${host}';
\$GLOBALS['TYPO3_CONF_VARS']['EXTENSIONS']['nr_passkeys_be']['origin'] = 'http://${host}';
PHP
}

# The browser reaches typo3.localhost through Chromium's --host-resolver-rules
# (see playwright.config.ts), but the suite also calls page.request.*, and that
# APIRequestContext resolves through Node, which knows nothing about Chromium's
# rules: `getaddrinfo ENOTFOUND typo3.localhost`, and every API spec fails while
# the browser-driven ones pass. A hosts entry in the Playwright container covers
# the Node side.
#
# The address is per run, so it is read from the container provisioning just
# started. Nothing is printed when that container does not exist, and that is
# what keeps a foreign target safe: E2E_SECURE_ALIAS_HOST is the switch
# playwright.config.ts reads before it rewrites anything, so a run pointed at
# an instance of its own with TYPO3_BASE_URL keeps its host header instead of
# being sent to a name its vhost never heard of.
e2e_container_args() {
    local ip
    ip=$(${CONTAINER_BIN} inspect "apache-e2e-${SUFFIX}" \
        --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null) || return 0
    [ -n "${ip}" ] || return 0
    printf '%s' "--add-host typo3.localhost:${ip} -e E2E_SECURE_ALIAS_HOST=typo3.localhost"
}

# JavaScript unit tests. The shared runner has no js suite, so this function
# adds one rather than overriding anything; package.json carries the same call
# as `npm run test:js`. No CI workflow runs it — it is a local convenience.
suite_js() {
    npx vitest run "$@"
}
